[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-showcase"
version = "0.1.0"
description = "Scenario-first visual product documentation for Django applications."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [
  {name = "django-showcase contributors"},
]
keywords = ["django", "documentation", "screenshots", "testing", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Django>=5.0,<6.0",
  "playwright>=1.55.0",
]

[project.urls]
Homepage = "https://github.com/<your-org>/django-showcase"
Repository = "https://github.com/<your-org>/django-showcase"
Issues = "https://github.com/<your-org>/django-showcase/issues"

[project.optional-dependencies]
ai = [
  "openai>=1.99.0",
]
test = [
  "pytest>=8.4.0",
  "pytest-django>=4.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_showcase"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src"]
testpaths = ["tests"]
