[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-showcase"
dynamic = ["version"]
description = "Scenario-first visual product documentation for Django applications."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [
  {name = "django-showcase contributors"},
]
keywords = ["django", "documentation", "screenshots", "testing", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Django>=5.0,<6.0",
  "playwright>=1.55.0",
]

[project.urls]
Homepage = "https://github.com/yaninsanity/django-showcase"
Repository = "https://github.com/yaninsanity/django-showcase"
Issues = "https://github.com/yaninsanity/django-showcase/issues"

[project.optional-dependencies]
ai = [
  "openai>=1.99.0",
]
test = [
  "pytest>=8.4.0",
  "pytest-django>=4.11.0",
]
dev = [
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
    "pytest-cov>=4.0.0",
    "python-semantic-release>=9.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "pre-commit>=3.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_showcase"]

[tool.semantic_release]
version_variables = ["src/django_showcase/_version.py:__version__"]
build_command = "python -m pip install --upgrade setuptools build wheel && python -m build"
major_on_zero = false
upload_to_pypi = true
upload_to_release = true
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "angular"
generate_changelog = true
changelog_file = "CHANGELOG.md"
changelog_file_template = ""
changelog_sections = [
    {type = "feature", section = "Features", display_in_release_notes = true},
    {type = "fix", section = "Bug Fixes", display_in_release_notes = true},
    {type = "refactor", section = "Refactoring", display_in_release_notes = false},
    {type = "perf", section = "Performance", display_in_release_notes = true},
    {type = "docs", section = "Documentation", display_in_release_notes = false},
]
release_asset_pattern = ""

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    ".tox"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]