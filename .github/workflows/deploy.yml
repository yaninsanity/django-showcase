name: Publish Python 🐍 Distribution 📦 to PyPI and TestPyPI

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SNAPSHOT JOB：dev 分支 → TestPyPI
  snapshot:
    if: github.ref == 'refs/heads/dev'
    name: Snapshot Release (TestPyPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install --upgrade python-semantic-release build setuptools wheel

      - name: Run Semantic Release (Snapshot)
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ github.token }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          prerelease: true

      - name: Build package if no release
        if: steps.release.outputs.released != 'true'
        run: |
          CURRENT_VERSION=$(python -c "import runpy; print(runpy.run_path('src/django_showcase/_version.py')['__version__'])")
          DEV_VERSION="${CURRENT_VERSION}.dev$(date +%Y%m%d%H%M%S)"
          echo "__version__ = \"$DEV_VERSION\"" > src/django_showcase/_version.py
          python -m build

      - name: Publish Snapshot to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # RELEASE JOB：main 分支 → PyPI
  release:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-release]')
    name: Official Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install --upgrade python-semantic-release build setuptools wheel

      - name: Run Semantic Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ github.token }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1